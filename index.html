<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Line Map Drawing Tool</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><rect x='5' y='3' width='14' height='14' rx='3'/><circle cx='12' cy='10' r='2'/><line x1='5' y1='20' x2='8' y2='17'/><line x1='19' y1='20' x2='16' y2='17'/><circle cx='8' cy='17' r='1'/><circle cx='16' cy='17' r='1'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <!-- 顶部工具栏 -->
  <header class="top-bar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="3" width="14" height="14" rx="3"/>
        <circle cx="12" cy="10" r="2"/>
        <line x1="5" y1="20" x2="8" y2="17"/>
        <line x1="19" y1="20" x2="16" y2="17"/>
        <circle cx="8" cy="17" r="1"/>
        <circle cx="16" cy="17" r="1"/>
      </svg>
      <span class="brand-name">Metro Line Map Drawing Tool</span>
    </div>
    <div class="top-actions">
      <button class="btn-ghost" id="undoBtn" title="撤销 (Ctrl+Z)" data-i18n-title="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="btn-ghost" id="redoBtn" title="重做 (Ctrl+Y)" data-i18n-title="redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <div class="divider"></div>
      <button class="btn-ghost" id="zoomOutBtn" title="缩小" data-i18n-title="zoomOut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="btn-ghost" id="zoomInBtn" title="放大" data-i18n-title="zoomIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button class="btn-ghost" id="fitViewBtn" title="适应视图" data-i18n-title="fitView">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <div class="divider"></div>
      <div class="settings-wrapper">
        <button class="btn-ghost" id="settingsBtn" title="设置" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="settings-dropdown" id="settingsDropdown">
          <div class="settings-section">
            <div class="settings-label" data-i18n="backgroundColor">背景颜色</div>
            <div class="bg-options">
              <button class="bg-option" data-bg="white" style="background:#ffffff; border-color:#475569;" title="白色"></button>
              <button class="bg-option active" data-bg="dark-blue" style="background:#0f172a;" title="深蓝"></button>
              <button class="bg-option" data-bg="black" style="background:#000000; border-color:#475569;" title="黑色"></button>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-label" data-i18n="grid">网格</div>
            <label class="switch">
              <input type="checkbox" id="gridToggle" checked>
              <span class="switch-slider"></span>
            </label>
          </div>
          <div class="settings-section">
            <div class="settings-label" data-i18n="language">语言</div>
            <select class="prop-input prop-select settings-select" id="languageSelect">
              <option value="zh" selected>中文</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn-primary" id="exportBtn" title="导出预览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="export">导出</span>
      </button>
    </div>
  </header>

  <div class="main-layout">
    <!-- 左侧属性面板 -->
    <aside class="left-panel" id="leftPanel">
      <div class="panel-header">
        <span class="panel-title" data-i18n="properties">属性面板</span>
        <button class="btn-icon" id="collapseLeftBtn" title="折叠" data-i18n-title="collapse">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="panel-body" id="propertyPanel">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p data-i18n="chooseElement">选择画布中的元素以编辑属性</p>
        </div>
      </div>
    </aside>

    <!-- 折叠后的展开按钮 -->
    <button class="expand-left-btn" id="expandLeftBtn" title="展开属性面板" data-i18n-title="expandPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <!-- 中间画布 -->
    <main class="canvas-container" id="canvasContainer">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid-small" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.3)"/>
          </pattern>
          <pattern id="grid-large" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-small)"/>
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect id="gridRect" x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid-large)"/>
        <g id="canvasContent"></g>
        <g id="overlay"></g>
      </svg>
      <div class="canvas-hint" id="canvasHint"></div>
      <div class="canvas-status">
        <span id="statusText" data-i18n="ready">就绪</span>
      </div>
    </main>

    <!-- 右侧工具栏 -->
    <aside class="right-panel" id="rightPanel">
      <div class="panel-header">
        <span class="panel-title" data-i18n="tools">工具</span>
      </div>
      <div class="panel-body">
        <div class="tool-section">
          <div class="section-label" data-i18n="select">选择</div>
          <div class="tool-grid">
            <button class="tool-btn active" data-tool="select" title="选择工具 (V)" data-i18n-title="selectTool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
              <span data-i18n="select">选择</span>
            </button>
          </div>
        </div>

        <div class="tool-section">
          <div class="section-label" data-i18n="station">站点 <span class="hint-text" data-i18n="dragToCanvas">拖拽到画布</span></div>
          <div class="tool-grid">
            <div class="tool-card" draggable="true" data-tool="station-normal" title="普通站点" data-i18n-title="normalStation">
              <div class="tool-icon station-normal-icon">
                <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>
              </div>
              <span data-i18n="normalStation">普通站</span>
            </div>
            <div class="tool-card" draggable="true" data-tool="station-interchange" title="换乘站点" data-i18n-title="interchangeStation">
              <div class="tool-icon station-interchange-icon">
                <svg viewBox="0 0 40 40">
                  <circle cx="20" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
                  <circle cx="20" cy="20" r="3" fill="currentColor"/>
                </svg>
              </div>
              <span data-i18n="interchangeStation">换乘站</span>
            </div>
          </div>
        </div>

        <div class="tool-section">
          <div class="section-label" data-i18n="create">创建</div>
          <div class="tool-grid">
            <button class="tool-btn" data-tool="line" title="线路工具 (L)" data-i18n-title="lineTool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="4" r="2" fill="currentColor"/></svg>
              <span data-i18n="line">线路</span>
            </button>
            <button class="tool-btn" data-tool="text" title="文本工具 (T)" data-i18n-title="textTool">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
              <span data-i18n="text">文本</span>
            </button>
          </div>
        </div>

        
      </div>
    </aside>
  </div>

  <!-- 导出预览弹窗 -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <h2>导出预览</h2>
        <button class="btn-icon" id="closeExportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="preview-area" id="previewArea">
          <!-- 预览内容将在此动态生成 -->
        </div>
        <div class="export-sections">
          <!-- 图片下载 -->
          <label class="export-toggle">
            <input type="checkbox" id="toggleImageDownload">
            <span data-i18n="imageDownload">图片下载</span>
          </label>
          <div id="imageDownloadPanel" class="export-panel">
            <div class="prop-group">
              <label class="prop-label" data-i18n="format">格式</label>
              <div style="display:flex; gap:16px; align-items:center;">
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
                  <input type="radio" name="imgFormat" value="svg" checked> SVG
                </label>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
                  <input type="radio" name="imgFormat" value="png"> PNG
                </label>
              </div>
            </div>
            <div class="prop-group" id="resolutionGroup" style="display:none;">
              <label class="prop-label" data-i18n="resolution">分辨率倍数</label>
              <select class="prop-input prop-select" id="pngScale" style="width:auto;">
                <option value="1" data-i18n="original">1x（原始尺寸）</option>
                <option value="2" selected data-i18n="hd">2x（高清）</option>
                <option value="3" data-i18n="uhd">3x（超清）</option>
                <option value="4" data-i18n="print">4x（印刷级）</option>
              </select>
            </div>
            <div class="prop-group">
              <label class="prop-label" data-i18n="legendPosition">图例位置</label>
              <select class="prop-input prop-select" id="legendCorner" style="width:auto;">
                <option value="top-left" data-i18n="topLeft">左上角</option>
                <option value="top-right" selected data-i18n="topRight">右上角</option>
                <option value="bottom-left" data-i18n="bottomLeft">左下角</option>
                <option value="bottom-right" data-i18n="bottomRight">右下角</option>
              </select>
            </div>
          </div>
          <!-- 报站音频下载 -->
          <label class="export-toggle">
            <input type="checkbox" id="toggleAudioDownload">
            <span data-i18n="audioDownload">报站音频下载</span>
          </label>
          <div id="audioDownloadPanel" class="export-panel">
            <div class="audio-hint" data-i18n="audioHint">
              点击"开始下载"后，浏览器会弹出共享对话框：<br>
              1. 选择<strong>当前标签页</strong><br>
              2. <strong>务必勾选</strong>底部"分享标签页音频"复选框<br>
              3. 点击"分享"，系统将逐条朗读并录制为 WAV 音频<br>
              4. 请保持标签页在前台，录制完成自动下载 ZIP<br>
              <br>
              <span>注意：如不勾选音频共享，将回退为导出文本文件 + Python 脚本。</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="startDownloadBtn" style="width:100%; justify-content:center;">开始下载</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/state.js?v=4"></script>
<script src="js/geometry.js?v=4"></script>
<script src="js/settings.js?v=4"></script>
<script src="js/canvas.js?v=5"></script>
<script src="js/properties.js?v=4"></script>
<script src="js/toolbar.js?v=4"></script>
<script src="js/export.js?v=4"></script>
<script src="js/app.js?v=4"></script>

</body>
</html>
